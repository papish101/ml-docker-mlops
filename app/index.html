<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Iris Flower Classifier</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .val-display { font-size: 0.9em; color: #007bff; font-weight: bold; float: right; }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 1em; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #218838; }
        .result-card { margin-top: 25px; padding: 20px; border-radius: 8px; background: #e9ecef; display: none; text-align: center; }
        .result-card img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; margin-top: 10px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .species-title { font-size: 1.4em; font-weight: bold; color: #155724; margin: 5px 0; }
        .source-tag { font-size: 0.8em; color: #6c757d; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Iris Flower Predictor Cluster</h2>
    
    <div class="form-group">
        <label>Sepal Length (cm) <span id="sl_val" class="val-display">5.1</span></label>
        <input type="range" id="sepal_length" min="4.0" max="8.0" step="0.1" value="5.1" oninput="document.getElementById('sl_val').innerText=this.value">
    </div>
    <div class="form-group">
        <label>Sepal Width (cm) <span id="sw_val" class="val-display">3.5</span></label>
        <input type="range" id="sepal_width" min="2.0" max="5.0" step="0.1" value="3.5" oninput="document.getElementById('sw_val').innerText=this.value">
    </div>
    <div class="form-group">
        <label>Petal Length (cm) <span id="pl_val" class="val-display">1.4</span></label>
        <input type="range" id="petal_length" min="1.0" max="7.0" step="0.1" value="1.4" oninput="document.getElementById('pl_val').innerText=this.value">
    </div>
    <div class="form-group">
        <label>Petal Width (cm) <span id="pw_val" class="val-display">0.2</span></label>
        <input type="range" id="petal_width" min="0.1" max="3.0" step="0.1" value="0.2" oninput="document.getElementById('pw_val').innerText=this.value">
    </div>

    <button onclick="sendPredictionRequest()">Classify Flower Species</button>

    <div id="resultCard" class="result-card">
        <div class="source-tag" id="predictSource">Processed via...</div>
        <div class="species-title" id="speciesName">Iris Flower</div>
        <img id="flowerImage" src="" alt="Predicted Species Photo">
    </div>
</div>

<script>
    // Live image URLs mapping directly to high-quality botanical database photos
    const FLOWER_IMAGES = {
        "Iris Setosa": "https://wikimedia.org",
        "Iris Versicolor": "https://wikimedia.org",
        "Iris Virginica": "https://wikimedia.org"
    };

    async function sendPredictionRequest() {
        const payload = {
            sepal_length: parseFloat(document.getElementById('sepal_length').value),
            sepal_width: parseFloat(document.getElementById('sepal_width').value),
            petal_length: parseFloat(document.getElementById('petal_length').value),
            petal_width: parseFloat(document.getElementById('petal_width').value)
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            // Map return values to UI elements dynamically
            document.getElementById('speciesName').innerText = result.species_name;
            document.getElementById('predictSource').innerText = `Data Source: ${result.source.toUpperCase()}`;
            
            // Render the specific corresponding flower photograph from the internet
            document.getElementById('flowerImage').src = FLOWER_IMAGES[result.species_name] || "";
            document.getElementById('resultCard').style.display = 'block';
        } catch (err) {
            alert('Error communicating with cluster backend services.');
        }
    }
</script>
</body>
</html>
