<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Species Predictor Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: flex; justify-content: space-between; color: #34495e; font-weight: 600; margin-bottom: 8px; }
        .value-display { color: #3498db; }
        input[type="range"] { width: 100%; accent-color: #3498db; }
        button {
            background: linear-gradient(to right, #2ecc71, #27ae60);
            color: white; border: none; border-radius: 8px; padding: 14px;
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer;
            transition: transform 0.1s; margin-top: 10px;
        }
        button:active { transform: scale(0.98); }
        .result-box {
            margin-top: 25px; padding: 20px; border-radius: 12px;
            display: none; background-color: #f8f9fa; border: 1px solid #e9ecef;
        }
        .species { font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0; }
        .meta-info { font-size: 12px; color: #7f8c8d; margin-top: 8px; }
        .flower-img { width: 120px; height: 120px; border-radius: 50%; margin-top: 10px; object-fit: cover; border: 3px solid #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h2>Iris Flower Classifier</h2>
    
    <div class="input-group">
        <label>Sepal Length: <span id="sepal_length_val" class="value-display">5.1</span> cm</label>
        <input type="range" id="sepal_length" min="4.0" max="8.0" step="0.1" value="5.1" oninput="updateVal('sepal_length')">
    </div>
    <div class="input-group">
        <label>Sepal Width: <span id="sepal_width_val" class="value-display">3.5</span> cm</label>
        <input type="range" id="sepal_width" min="2.0" max="4.5" step="0.1" value="3.5" oninput="updateVal('sepal_width')">
    </div>
    <div class="input-group">
        <label>Petal Length: <span id="petal_length_val" class="value-display">1.4</span> cm</label>
        <input type="range" id="petal_length" min="1.0" max="7.0" step="0.1" value="1.4" oninput="updateVal('petal_length')">
    </div>
    <div class="input-group">
        <label>Petal Width: <span id="petal_width_val" class="value-display">0.2</span> cm</label>
        <input type="range" id="petal_width" min="0.1" max="2.5" step="0.1" value="0.2" oninput="updateVal('petal_width')">
    </div>

    <button onclick="makePrediction()">Predict Species</button>

    <div id="result" class="result-box">
        <div style="color: #7f8c8d; font-size: 14px; font-weight: 500;">Prediction Result:</div>
        <div id="species_name" class="species">Evaluating...</div>
        <div id="image_container"></div>
        <div id="source_info" class="meta-info">Fetched via: --</div>
    </div>
</div>

<script>
    function updateVal(id) { document.getElementById(id + '_val').innerText = document.getElementById(id).value; }

    async function makePrediction() {
        // Automatically targets the active host running the frontend script
        const host = window.location.hostname;
        const API_URL = `http://${host}:8000/predict`;
        
        const payload = {
            sepal_length: parseFloat(document.getElementById('sepal_length').value),
            sepal_width: parseFloat(document.getElementById('sepal_width').value),
            petal_length: parseFloat(document.getElementById('petal_length').value),
            petal_width: parseFloat(document.getElementById('petal_width').value)
        };

        const resultBox = document.getElementById('result');
        resultBox.style.display = 'block';
        document.getElementById('species_name').innerText = 'Processing...';
        document.getElementById('image_container').innerHTML = '';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('API server returned an error');
            const data = await response.json();
            
            document.getElementById('species_name').innerText = data.species_name;
            document.getElementById('source_info').innerText = `Source: ${data.source.replace('_', ' ')}`;

            // Inject distinct placeholder SVG sketches dynamically based on code
            let color = data.prediction === 0 ? "#9b59b6" : (data.prediction === 1 ? "#3498db" : "#e74c3c");
            document.getElementById('image_container').innerHTML = `
                <svg class="flower-img" viewBox="0 0 100 100" style="background:#f1f2f6; padding:10px; border-color:${color}">
                    <circle cx="50" cy="50" r="15" fill="#f1c40f"/>
                    <circle cx="50" cy="25" r="12" fill="${color}" opacity="0.8"/>
                    <circle cx="50" cy="75" r="12" fill="${color}" opacity="0.8"/>
                    <circle cx="25" cy="50" r="12" fill="${color}" opacity="0.8"/>
                    <circle cx="75" cy="50" r="12" fill="${color}" opacity="0.8"/>
                </svg>`;
            
        } catch (error) {
            document.getElementById('species_name').innerText = 'Connection Failed';
            document.getElementById('source_info').innerText = 'Check API connectivity on port 8000.';
        }
    }
</script>
</body>
</html>
