apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  template:
    metadata:
      labels:
        io.kompose.network/ml-network: "true"
        io.kompose.service: grafana
    spec:
      containers:
      - image: grafana/grafana:latest
        name: ml-grafana
        ports:
        - containerPort: 3000
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          name: grafana-config-volume
          subPath: dashboards.yml
      restartPolicy: Always
      volumes:
      - name: grafana-config-volume
        configMap:
          name: grafana-provisioning-config
