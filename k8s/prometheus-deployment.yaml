apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: prometheus
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prometheus
  template:
    metadata:
      labels:
        io.kompose.network/ml-network: "true"
        io.kompose.service: prometheus
    spec:
      containers:
      - image: prom/prometheus:latest
        name: ml-prometheus
        ports:
        - containerPort: 9090
        volumeMounts:
        - mountPath: /etc/prometheus/prometheus.yml
          name: prometheus-config-volume
          subPath: prometheus.yml
      restartPolicy: Always
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
